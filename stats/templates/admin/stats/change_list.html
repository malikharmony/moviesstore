{% extends "admin/change_list.html" %}

{% block search %}
    <div style="margin-bottom: 15px; padding: 10px; background: var(--changelist-bg, #273540); border: 1px solid #000; border-radius: 4px;">
        <form method="get" action="">
            <label for="list_size" style="font-weight: bold; margin-right: 8px;">List Size:</label>

            <input 
                type="number"
                id="list_size"
                name="list_size"
                value="{{ list_size|default:'' }}"
                placeholder="All users"
                min="1"
                style="padding: 4px 8px; width: 120px;">
            <input type="submit" value="filter" class="button" style="margin-left: 8px;">

            {% if list_size %}
                <a href="?" style="margin-left: 8px; text-decoration: none;">Show All</a>
            {% endif %}
        </form>
    </div>
{% endblock %}
